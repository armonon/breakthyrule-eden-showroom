<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>BREAKTHYRULE — Garment</title>
 <link rel="icon" type="image/png" href="/assets/favicon-32.png">
 <link rel="stylesheet" href="/site/site.css?v=1">
 <script defer src="/assets/three.min.js?v=187"></script>
 <script defer src="/asset-loader.js?v=4"></script>
 <script defer src="/garment-catalog.js?v=11"></script>
 <script defer src="/site/config.js?v=1"></script>
 <script defer src="/site/site.js?v=1"></script>
 <script defer src="/site/garment-stage.js?v=1"></script>
 <script defer src="/site/product.js?v=1"></script>
</head>
<body data-page="home">
 <main>
  <section class="product-page">
   <div class="viewer card-media" id="viewer" tabindex="0" aria-label="Rotatable 3D garment. Drag or use the arrow keys to turn it.">
    <img id="photo" alt="">
    <span class="viewer-status" id="viewer-status" role="status"></span>
    <div class="viewer-tools">
     <button type="button" id="spin" aria-pressed="true">Spin</button>
     <button type="button" id="front">Front</button>
     <button type="button" id="back">Back</button>
     <button type="button" id="photos">Photo</button>
    </div>
   </div>
   <div class="product-info">
    <p class="kicker" id="chapter"></p>
    <h1 id="name"></h1>
    <p class="price" id="price"></p>
    <p class="lede" id="tagline"></p>
    <p id="description"></p>
    <div class="thumbs" id="thumbs" aria-label="Product photographs"></div>
    <div class="hero-actions">
     <a class="solid" id="buy" href="https://breakthyrule-co.netlify.app" target="_blank" rel="noopener">Buy <span aria-hidden="true">↗</span></a>
     <a class="ghost" href="/showroom">See it in the showroom <span aria-hidden="true">↗</span></a>
    </div>
    <p class="note" id="model-note"></p>
   </div>
  </section>
  <section class="section wrap">
   <p class="kicker">Talk about this piece</p>
   <div id="discussion"></div>
  </section>
 </main>
</body>
</html>
