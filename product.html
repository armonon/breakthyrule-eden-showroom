<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>BREAKTHYRULE — Garment</title>
 <link rel="icon" type="image/png" href="/assets/favicon-32.png">
 <link rel="stylesheet" href="/site/site.css?v=2">
 <link rel="stylesheet" href="/site/codex.css?v=1">
 <link rel="stylesheet" href="/breakthyrule-cover.css?v=8">
 <link rel="stylesheet" href="/site/folios.css?v=12">
 <link rel="stylesheet" href="/site/commerce.css?v=5">
 <script defer src="/assets/three.min.js?v=187"></script>
 <script defer src="/asset-loader.js?v=5"></script>
 <script defer src="/garment-catalog.js?v=11"></script>
 <script defer src="/site/config.js?v=1"></script>
 <script defer src="/site/site.js?v=7"></script>
 <script defer src="/site/garment-stage.js?v=5"></script>
 <script defer src="/breakthyrule-assets.js?v=2"></script>
 <script defer src="/breakthyrule-cover.js?v=9"></script>
 <script type="module" src="/site/cart-ui.js?v=2"></script>
 <script defer src="/site/product.js?v=3"></script>
</head>
<body data-page="home">
 <main>
  <section class="product-page">
   <div class="viewer card-media" id="viewer" tabindex="0" aria-label="Rotatable 3D garment. Drag or use the arrow keys to turn it.">
    <div class="halo" id="halo"></div>
    <div class="pedestal"></div>
    <img id="photo" alt="">
    <span class="viewer-status" id="viewer-status" role="status"></span>
    <div class="viewer-tools">
     <button type="button" id="spin" aria-pressed="true">Spin</button>
     <button type="button" id="front">Front</button>
     <button type="button" id="back">Back</button>
     <button type="button" id="photos">Photo</button>
    </div>
   </div>
   <div class="product-info">
    <div class="plate-mark"><span class="numeral" id="numeral"></span><p class="kicker" id="chapter" style="margin:0"></p></div>
    <h1 id="name"></h1>
    <p class="price" id="price"></p>
    <p class="lede" id="tagline"></p>
    <p id="description" class="drop-para"></p>
    <div class="thumbs" id="thumbs" aria-label="Product photographs"></div>
    <div class="hero-actions">
     <a class="solid" id="buy" href="https://breakthyrule-co.netlify.app" target="_blank" rel="noopener">Buy <span aria-hidden="true">↗</span></a>
     <a class="ghost" href="/showroom">See it in the showroom <span aria-hidden="true">↗</span></a>
    </div>
    <p class="note" id="model-note"></p>
   </div>
  </section>
  <div class="ornament" aria-hidden="true"><span>❦</span></div>
  <section class="section wrap gallery-showcase" aria-labelledby="showcase-title">
   <div class="section-head">
    <div><p class="kicker">From the gallery</p><h2 id="showcase-title"><span class="sect">§</span>Worn in real life</h2></div>
    <div class="showcase-tools">
     <button type="button" class="ghost" id="showcase-prev" aria-label="Scroll the gallery strip back">←</button>
     <button type="button" class="ghost" id="showcase-next" aria-label="Scroll the gallery strip forward">→</button>
     <a class="solid" href="/gallery">The whole gallery <span aria-hidden="true">↗</span></a>
    </div>
   </div>
   <div class="showcase-strip" id="showcase" aria-label="Photographs from the gallery"></div>
  </section>
 </main>
</body>
</html>
