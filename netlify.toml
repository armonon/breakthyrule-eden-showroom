redirectsOrigin = "config"
plugins = []

[build]
publish = "."
publishOrigin = "config"

  [build.environment]

  [build.processing]
  skip_processing = true

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]
  node_bundler = "esbuild"

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "SAMEORIGIN"
  Content-Security-Policy = "frame-ancestors 'self'"

[[redirects]]
from = "/showroom"
to = "/showroom.html"
status = 200
force = false

[[redirects]]
from = "/showroom/"
to = "/showroom.html"
status = 200
force = false

[[redirects]]
from = "/gallery"
to = "/gallery.html"
status = 200
force = false

[[redirects]]
from = "/archive"
to = "/archive.html"
status = 200
force = false

[[redirects]]
from = "/community"
to = "/community.html"
status = 200
force = false

[[redirects]]
from = "/product"
to = "/product.html"
status = 200
force = false

[[redirects]]
from = "/studio"
to = "/studio.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/studio/"
to = "/studio.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/api/*"
to = "/preview-api-unavailable.json"
status = 404
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]