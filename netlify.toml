redirectsOrigin = "config"
plugins = []

[build]
command = "node tools/release/check-release.mjs --write-manifest"
publish = "."
publishOrigin = "config"

  [build.environment]

  [build.processing]
  skip_processing = true

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]
directory = "netlify/functions"

  [functions."*"]
  node_bundler = "esbuild"

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "SAMEORIGIN"
  Content-Security-Policy = "frame-ancestors 'self'"

# Multiplayer lives on the game host (Netlify can't hold WebSockets; see docs/MULTIPLAYER-HOSTING.md).
# 302, not a proxy, so live play goes straight to the host. Temporary so the target can move (domain, Fly.io).
[[redirects]]
from = "/play"
to = "https://lillypads-macbook-air.tail4736c7.ts.net:10000/showroom"
status = 302
force = true

[[redirects]]
from = "/play/"
to = "https://lillypads-macbook-air.tail4736c7.ts.net:10000/showroom"
status = 302
force = true

# Lets showroom-start.html check whether the game host is up before offering multiplayer.
[[redirects]]
from = "/play-status"
to = "https://lillypads-macbook-air.tail4736c7.ts.net:10000/deployment.js"
status = 302
force = true

# /showroom asks Solo or Multiplayer first; Solo opens /showroom.html (the static game, as before).
# force = true: otherwise Netlify's clean URLs serve showroom.html for /showroom and skip this rule.
[[redirects]]
from = "/showroom"
to = "/showroom-start.html"
status = 200
force = true

[[redirects]]
from = "/showroom/"
to = "/showroom-start.html"
status = 200
force = true

[[redirects]]
from = "/gallery"
to = "/gallery.html"
status = 200
force = false

[[redirects]]
from = "/archive"
to = "/archive.html"
status = 200
force = false

[[redirects]]
from = "/community"
to = "/archive#forum"
status = 302
force = true

[[redirects]]
from = "/community/"
to = "/archive#forum"
status = 302
force = true

[[redirects]]
from = "/forum"
to = "/archive#forum"
status = 302
force = true

[[redirects]]
from = "/account"
to = "/account.html"
status = 200

[[redirects]]
from = "/account/"
to = "/account.html"
status = 200

[[redirects]]
from = "/size-guide"
to = "/size-guide.html"
status = 200

[[redirects]]
from = "/lab-setup"
to = "/lab-setup.html"
status = 200

[[redirects]]
from = "/product"
to = "/product.html"
status = 200
force = false

[[redirects]]
from = "/studio"
to = "/studio.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/studio/"
to = "/studio.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/api/community/*"
to = "/.netlify/functions/community/:splat"
status = 200
force = true

[[redirects]]
from = "/api/lab/*"
to = "/.netlify/functions/lab/:splat"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "/preview-api-unavailable.json"
status = 404
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]
